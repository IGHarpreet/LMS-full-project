<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8242b" />
    <!-- Apply the saved theme before first paint (prevents a flash of the wrong theme).
         Mirrors utils/theme.js: only "dark" is honoured, anything else is light, and the
         light-only login screen (no access token) always stays light. -->
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("ebs-theme") === "dark" && localStorage.getItem("access_token1")) {
            theme = "dark";
          }
        } catch (e) { /* storage blocked -> light */ }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <meta
      name="description"
      content="SBS Bela – employee attendance, leave and project management"
    />
 
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SBS Bela · Employee Management</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
  
    <div id="root"></div>
    <link rel="stylesheet/less" type="text/css" href="color.less" />
    <script>
      window.less = {
        async: true,
        env: 'production'
      };
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/less.js/2.7.2/less.min.js"></script>
  
  </body>
</html>
